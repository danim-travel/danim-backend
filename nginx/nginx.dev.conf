upstream django {
    server django:8000;
}

server {
    listen 80;
    server_name dev-api.danim.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev-api.danim.kr;

    ssl_certificate /etc/letsencrypt/live/dev-api.danim.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-api.danim.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS — 지시어 근거는 nginx.conf(운영)의 같은 위치 주석 참고.
    # includeSubDomains의 범위는 dev-api.danim.kr과 그 하위뿐이라(RFC 6797 §6.1.2)
    # 운영·프론트에 닿지 않는다.
    #
    # **max-age만 운영(1년)과 다르게 1일로 둔다.** HSTS가 걸린 호스트에서 인증서
    # 오류가 나면 브라우저가 연결을 강제 종료하고 "계속 진행" 버튼 자체를 없앤다
    # (RFC 6797 §8.4). 헤더를 지워도 이미 pin된 브라우저는 풀리지 않고,
    # max-age=0 재배포는 인증서가 살아 있어야 전달되므로 깨진 상태에서는
    # 각자 chrome://net-internals/#hsts 수동 삭제밖에 없다.
    # 이 레포에는 인증서 자동 갱신 경로가 없고(certbot/acme/well-known 0건, :80은
    # 전부 301이라 webroot 갱신 불가) dev는 팀 전원의 작업 환경이라, 사고 시
    # 최대 1년 봉쇄는 감당할 수 없다. 갱신 자동화를 검증한 뒤 값을 올릴 것.
    #
    # ⚠ 이 헤더는 상속으로만 전달된다 — 아래 location 중 하나라도 자체 add_header를
    #    추가하면 그 경로의 HSTS가 통째로 사라진다.
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    #    auth_basic "Dev Server";
    #   auth_basic_user_file /etc/nginx/.htpasswd;

    location /api/ {
        auth_basic off;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

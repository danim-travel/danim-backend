upstream django {
    server django:8000;
}

server {
    listen 80;
    server_name dev-api.danim.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev-api.danim.kr;

    ssl_certificate /etc/letsencrypt/live/dev-api.danim.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-api.danim.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS — 근거는 nginx.conf(운영)의 같은 위치 주석 참고. dev도 전 경로가 HTTPS
    # 전용이라 동일하게 둔다. includeSubDomains·preload는 danim.kr 계열 전체에
    # 영향을 주므로 여기서도 붙이지 않는다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    #    auth_basic "Dev Server";
    #   auth_basic_user_file /etc/nginx/.htpasswd;

    location /api/ {
        auth_basic off;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

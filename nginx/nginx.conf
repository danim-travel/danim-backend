upstream django {
    server django:8000;
}

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name api.danim.kr;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name api.danim.kr;

    ssl_certificate /etc/letsencrypt/live/api.danim.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.danim.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS — 위 80포트 301만으로는 첫 접속이 평문이라 그 사이에 가로채기가 가능하다.
    # 한 번 방문한 브라우저는 이후 http:// 입력 자체를 https로 바꿔 요청한다.
    #
    # includeSubDomains를 붙인다. HSTS 정책은 **헤더를 내려준 호스트와 그 호스트의
    # 하위 도메인**에만 적용된다(RFC 6797 §6.1.2). 여기서 호스트는 api.danim.kr이라
    # 범위는 api.danim.kr과 *.api.danim.kr뿐이고, danim.kr(프론트)와
    # dev-api.danim.kr은 각각 부모·형제라 닿지 않는다. 지금 *.api.danim.kr은 0개라
    # 실질 영향이 없지만, 나중에 생길 하위 도메인의 스푸핑을 미리 막는다.
    #
    # preload는 넣지 않는다 — 브라우저 목록에 박히면 되돌리는 데 수개월이 걸려
    # 얻는 것에 비해 비용이 비대칭이다.
    #
    # max-age는 1년. 운영은 인증서가 끊기면 어차피 서비스가 멈추는 곳이라 HSTS가
    # 추가로 악화시키는 폭이 작다(dev는 반대여서 값이 다르다 — nginx.dev.conf 참고).
    #
    # always가 없으면 4xx/5xx 응답에는 헤더가 붙지 않는다.
    # ⚠ 이 헤더는 상속으로만 전달된다 — 아래 location 중 하나라도 자체 add_header를
    #    추가하면 그 경로의 HSTS가 통째로 사라진다(nginx add_header 상속 규칙).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

upstream django {
    server django:8000;
}

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name api.danim.kr;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name api.danim.kr;

    ssl_certificate /etc/letsencrypt/live/api.danim.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.danim.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS — 위 80포트 301만으로는 첫 접속이 평문이라 그 사이에 가로채기가 가능하다.
    # 한 번 방문한 브라우저는 이후 http:// 입력 자체를 https로 바꿔 요청한다.
    #
    # includeSubDomains는 넣지 않는다 — danim.kr 하위 전체(프론트 포함)에 소급 적용돼
    # 아직 HTTPS가 아닌 서브도메인이 생기면 접근 자체가 막힌다.
    # preload도 넣지 않는다 — 브라우저에 박히면 되돌리는 데 수개월이 걸린다.
    # max-age는 1년. 늘릴 때는 짧게 시작해 검증 후 올리는 것이 원칙이나, 이 도메인은
    # 이미 전 경로가 HTTPS 전용이라 처음부터 1년으로 둔다.
    #
    # always가 없으면 4xx/5xx 응답에는 헤더가 붙지 않는다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

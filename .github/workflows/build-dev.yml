name: Build Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  # conf 문법 오류는 배포 후 nginx가 뜨지 못해 전면 장애가 되고 자동 롤백이 없다.
  # develop에 브랜치 보호가 없어 PR을 거치지 않은 push가 그대로 배포되므로,
  # PR CI뿐 아니라 이 경로에도 같은 게이트를 둔다.
  nginx:
    uses: ./.github/workflows/nginx-check.yml

  build:
    needs: nginx
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/danim-backend:dev

  deploy:
    needs: build
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit

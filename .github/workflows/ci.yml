name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: black
        run: uv run black --check .

      - name: isort
        run: uv run isort --check-only .

      - name: mypy
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: danim
          DB_USER: danim
          DB_PASSWORD: danim
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          REDIS_AUTH_URL: redis://localhost:6379/2
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: uv run mypy .

      - name: django deploy check (prod settings)
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: danim
          DB_USER: danim
          DB_PASSWORD: danim
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          REDIS_AUTH_URL: redis://localhost:6379/2
          ALLOWED_HOSTS: api.danim.kr
          CORS_ALLOWED_ORIGINS: https://danim.kr
          ADMIN_URL: ci-check-path/
        run: uv run python manage.py check --deploy --settings=config.settings.prod

      # 배포는 down → up -d라 conf 문법 오류가 곧 자동 롤백 없는 전면 장애다
      # (nginx가 뜨지 못해 502). 여기서 먼저 깨뜨린다.
      #
      # nginx -t는 실제로 ssl_certificate 파일 존재를 확인하고 upstream 호스트명을
      # 해석하므로, 자체 서명 인증서를 실경로에 만들고 django를 로컬로 매핑해 준다.
      #
      # 검사 대상과 인증서 경로는 conf에서 직접 뽑는다 — 목록을 여기 적어두면 conf가
      # 늘거나 호스트가 바뀌었을 때 조용히 검사에서 빠진다.
      #
      # lint 잡의 앞 스텝(black/isort/mypy)이 실패해도 이 검사는 돌아야 한다.
      # 배포를 막는 종류의 결함이라 포맷 오류에 가려지면 안 된다.
      - name: nginx 설정 문법 검사
        if: always()
        run: |
          set -e
          confs=$(ls nginx/*.conf)
          echo "검사 대상: $confs"

          # conf가 참조하는 인증서 경로를 그대로 만들어 준다
          for cert in $(grep -hoE '^\s*ssl_certificate\s+\S+' $confs | awk '{print $2}' | tr -d ';'); do
            dir=$(dirname "$cert")
            host=$(basename "$dir")
            sudo mkdir -p "$dir"
            sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
              -keyout "$dir/privkey.pem" -out "$dir/fullchain.pem" \
              -subj "/CN=$host" 2>/dev/null
          done
          sudo chmod -R a+rX /etc/letsencrypt

          # compose와 같은 이미지 태그를 쓴다(런타임과 파서가 갈리지 않도록)
          for conf in $confs; do
            echo "--- $conf ---"
            docker run --rm \
              --add-host django:127.0.0.1 \
              -v "$PWD/$conf:/etc/nginx/conf.d/default.conf:ro" \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              nginx:alpine nginx -t
          done

  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: danim
          POSTGRES_USER: danim
          POSTGRES_PASSWORD: danim
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: danim
          DB_USER: danim
          DB_PASSWORD: danim
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          REDIS_AUTH_URL: redis://localhost:6379/2
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: |
          set +e
          uv run coverage run -m pytest
          exit_code=$?
          set -e
          if [ $exit_code -eq 5 ]; then exit 0; else exit $exit_code; fi

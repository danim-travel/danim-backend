name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      # pre-commit 훅은 uv.lock 을 읽지 못해 설정 파일에 적힌 값으로 설치한다.
      # 두 파일이 따로 관리되므로 uv lock 이 돌 때마다 어긋날 수 있어 자동으로 대조한다.
      # Django settings 를 임포트하지 않으므로 env 블록이 필요 없다(실행 1초 미만).
      - name: 훅 설정 ↔ uv.lock 정합 검사
        run: uv run python scripts/check_hook_pins.py

      - name: black
        run: uv run black --check .

      - name: isort
        run: uv run isort --check-only .

      - name: mypy
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: danim
          DB_USER: danim
          DB_PASSWORD: danim
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          REDIS_AUTH_URL: redis://localhost:6379/2
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: uv run mypy .

      - name: django deploy check (prod settings)
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: danim
          DB_USER: danim
          DB_PASSWORD: danim
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          REDIS_AUTH_URL: redis://localhost:6379/2
          ALLOWED_HOSTS: api.danim.kr
          CORS_ALLOWED_ORIGINS: https://danim.kr
          ADMIN_URL: ci-check-path/
        run: uv run python manage.py check --deploy --settings=config.settings.prod

  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: danim
          POSTGRES_USER: danim
          POSTGRES_PASSWORD: danim
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: danim
          DB_USER: danim
          DB_PASSWORD: danim
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          REDIS_AUTH_URL: redis://localhost:6379/2
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: |
          set +e
          uv run coverage run -m pytest
          exit_code=$?
          set -e
          if [ $exit_code -eq 5 ]; then exit 0; else exit $exit_code; fi

  # 배포 경로(build.yml·build-dev.yml)에서도 같은 검사를 호출한다 — 상세 근거는
  # nginx-check.yml 헤더 참고.
  nginx:
    uses: ./.github/workflows/nginx-check.yml

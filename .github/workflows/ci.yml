name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: black
        run: uv run black --check .

      - name: isort
        run: uv run isort --check-only .

      - name: mypy
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: danim
          DB_USER: danim
          DB_PASSWORD: danim
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          REDIS_AUTH_URL: redis://localhost:6379/2
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: uv run mypy .

      - name: django deploy check (prod settings)
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: danim
          DB_USER: danim
          DB_PASSWORD: danim
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          REDIS_AUTH_URL: redis://localhost:6379/2
          ALLOWED_HOSTS: api.danim.kr
          CORS_ALLOWED_ORIGINS: https://danim.kr
          ADMIN_URL: ci-check-path/
        run: uv run python manage.py check --deploy --settings=config.settings.prod

      # 배포는 down → up -d라 conf 문법 오류가 곧 자동 롤백 없는 전면 장애다
      # (nginx가 뜨지 못해 502). 여기서 먼저 깨뜨린다.
      #
      # nginx -t는 실제로 ssl_certificate 파일 존재를 확인하고 upstream 호스트명을
      # 해석하므로, 자체 서명 인증서를 실경로에 만들고 django를 로컬로 매핑해 준다.
      - name: nginx 설정 문법 검사
        run: |
          set -e
          for host in api.danim.kr dev-api.danim.kr; do
            sudo mkdir -p "/etc/letsencrypt/live/$host"
            sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
              -keyout "/etc/letsencrypt/live/$host/privkey.pem" \
              -out "/etc/letsencrypt/live/$host/fullchain.pem" \
              -subj "/CN=$host" 2>/dev/null
          done
          sudo chmod -R a+rX /etc/letsencrypt
          for conf in nginx/nginx.conf nginx/nginx.dev.conf; do
            echo "--- $conf ---"
            docker run --rm \
              --add-host django:127.0.0.1 \
              -v "$PWD/$conf:/etc/nginx/conf.d/default.conf:ro" \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              nginx:alpine nginx -t
          done

  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: danim
          POSTGRES_USER: danim
          POSTGRES_PASSWORD: danim
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: danim
          DB_USER: danim
          DB_PASSWORD: danim
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          REDIS_AUTH_URL: redis://localhost:6379/2
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: |
          set +e
          uv run coverage run -m pytest
          exit_code=$?
          set -e
          if [ $exit_code -eq 5 ]; then exit 0; else exit $exit_code; fi

name: Deploy Dev

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get GitHub Actions runner IP
        id: ip
        run: echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Open SSH port for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.DEV_EC2_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2

      - name: Deploy to Dev EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          # 기본값(false)이면 drone-ssh가 명령마다 종료코드 가드를 붙이지 않아
          # migrate가 실패해도 다음 줄 up -d가 실행된다 — 신규 코드 워커가 구
          # 스키마에 붙고, 마지막 명령이 성공하면 "배포 완료"까지 나간다(4차 리뷰).
          script_stop: true
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_PRIVATE_KEY }}
          script: |
            cd ~/danim-backend
            git fetch origin
            git checkout develop
            git pull origin develop

            # .env.dev 파일 생성
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > envs/.env.dev
            echo "DB_HOST=db" >> envs/.env.dev
            echo "DB_NAME=${{ secrets.DEV_DB_NAME }}" >> envs/.env.dev
            echo "DB_USER=${{ secrets.DEV_DB_USER }}" >> envs/.env.dev
            echo "DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}" >> envs/.env.dev
            echo "DB_PORT=5432" >> envs/.env.dev
            echo "REDIS_URL=redis://redis:6379/1" >> envs/.env.dev
            echo "REDIS_AUTH_URL=redis://redis:6379/2" >> envs/.env.dev
            echo "ALLOWED_HOSTS=${{ secrets.DEV_ALLOWED_HOSTS }}" >> envs/.env.dev
            echo "CORS_ALLOWED_ORIGINS=${{ secrets.DEV_CORS_ALLOWED_ORIGINS }}" >> envs/.env.dev
            echo "EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}" >> envs/.env.dev
            echo "EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}" >> envs/.env.dev
            echo "S3_REGION=${{ secrets.S3_REGION }}" >> envs/.env.dev
            echo "S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}" >> envs/.env.dev
            echo "S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}" >> envs/.env.dev
            echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> envs/.env.dev
            echo "S3_PREFIX=dev/" >> envs/.env.dev
            echo "S3_PATH={action}/image/{category}/{suffix}" >> envs/.env.dev
            echo "KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}" >> envs/.env.dev
            echo "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}" >> envs/.env.dev
            echo "KAKAO_REDIRECT_URI=${{ secrets.DEV_KAKAO_REDIRECT_URI }}" >> envs/.env.dev
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> envs/.env.dev
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> envs/.env.dev
            echo "GOOGLE_REDIRECT_URI=${{ secrets.DEV_GOOGLE_REDIRECT_URI }}" >> envs/.env.dev
            echo "FRONT_REDIRECT_URI=${{ secrets.DEV_FRONT_REDIRECT_URI }}" >> envs/.env.dev
            echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> envs/.env.dev
            echo "FRONTEND_URL=${{ secrets.DEV_FRONTEND_URL }}" >> envs/.env.dev
            echo "ADMIN_URL=${{ secrets.DEV_ADMIN_URL }}" >> envs/.env.dev
            echo "DJANGO_ENV=dev" >> envs/.env.dev

            # 새 이미지 pull 및 재시작
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            docker pull ${{ secrets.DOCKER_USERNAME }}/danim-backend:dev
            # 트래픽을 끊고(컨테이너는 남긴다) migrate 후 재기동한다.
            # 근거는 deploy.yml의 같은 위치 주석 — `down` 뒤면 실패 시 전면 다운,
            # 구 스택이 살아 있는 채면 DDL 락이 트래픽과 만난다.
            # 목록이 흩어져 있으면 서비스를 추가할 때 한 곳을 빠뜨린다 —
            # 특히 롤백(start)에서 빠지면 그 서비스만 안 살아난다.
            SVCS="django nginx celery-worker celery-s3-worker celery-beat"

            docker-compose -f docker-compose.dev.yml stop $SVCS

            # dev는 DB가 compose 서비스다. 이미 떠 있으면 아무 일도 하지 않는다.
            docker-compose -f docker-compose.dev.yml up -d db redis

            # 고정 sleep은 EC2가 바쁠 때 그대로 실패한다 — 준비될 때까지 물어본다.
            # `-h localhost`로 TCP를 강제한다: postgres 엔트리포인트의 초기화용 임시
            # 서버는 listen_addresses=''로 TCP만 막고 유닉스 소켓은 열어 두므로,
            # 소켓으로 물으면 볼륨을 처음 만드는 배포에서 조기 통과한다.
            for i in $(seq 1 30); do
              docker-compose -f docker-compose.dev.yml exec -T db                 sh -c 'pg_isready -q -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB"' && break
              [ "$i" = 30 ] && { echo "::error::db가 60초 안에 준비되지 않았습니다"; exit 1; }
              sleep 2
            done

            if ! docker-compose -f docker-compose.dev.yml run --rm --no-deps django uv run --no-sync python manage.py migrate; then
              echo "::error::migrate 실패 — 구 스택을 되살립니다"
              docker-compose -f docker-compose.dev.yml start $SVCS
              exit 1
            fi

            docker-compose -f docker-compose.dev.yml down
            docker-compose -f docker-compose.dev.yml up -d

            # up -d는 컨테이너를 **시작**하면 반환한다. celery는 Django 앱 전체를
            # 임포트하므로 설정·env 오류로 죽는 데 5~15초가 걸려, 곧바로 확인하면
            # 아직 running이라 통과해 버린다. 잠시 기다린 뒤 상태와 재시작 횟수를
            # 함께 본다 — RestartCount>0이면 떴다가 죽고 있다는 뜻이다(4차 리뷰).
            sleep 25
            for s in $SVCS; do
              cid=$(docker-compose -f docker-compose.dev.yml ps -q "$s")
              st=$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null || echo missing)
              rc=$(docker inspect -f '{{.RestartCount}}' "$cid" 2>/dev/null || echo 0)
              if [ "$st" != "running" ] || [ "$rc" -gt 0 ]; then
                echo "::error::$s 기동 실패(status=$st restarts=$rc)"
                docker-compose -f docker-compose.dev.yml logs --tail=50 "$s"
                exit 1
              fi
            done

            docker image prune -f

      - name: Close SSH port
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.DEV_EC2_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2

      - name: Discord 배포 성공 알림
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "🛠️ **Dev 배포 완료!**\n브랜치: develop\n상태: 성공 ✅"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Discord 배포 실패 알림
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "❌ **Dev 배포 실패!**\n브랜치: develop\n확인이 필요합니다."}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

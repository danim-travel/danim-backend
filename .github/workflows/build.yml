name: Build

on:
  push:
    branches: [main]

jobs:
  # conf 문법 오류는 배포 후 nginx가 뜨지 못해 전면 장애가 되고 자동 롤백이 없다.
  # main에 브랜치 보호가 없어 PR을 거치지 않은 push가 그대로 배포되므로,
  # PR CI뿐 아니라 이 경로에도 같은 게이트를 둔다.
  nginx:
    uses: ./.github/workflows/nginx-check.yml

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      # main 에 브랜치 보호가 없어 PR 을 거치지 않은 push 가 그대로 배포되므로,
      # PR CI(ci.yml)뿐 아니라 배포를 일으키는 이 경로에도 같은 게이트를 둔다.
      # 표준 라이브러리만 쓰지만 tomllib 이 3.11+ 이므로 러너 기본 python 대신
      # 프로젝트 인터프리터로 실행한다(uv sync 직후라 재동기화는 no-op).
      - name: 훅 설정 ↔ uv.lock 정합 검사
        run: uv run python scripts/check_hook_pins.py

      - name: black
        run: uv run black --check .

      - name: isort
        run: uv run isort --check-only .

      - name: mypy
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: danim
          DB_USER: danim
          DB_PASSWORD: danim
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          REDIS_AUTH_URL: redis://localhost:6379/2
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: uv run mypy .

  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: danim
          POSTGRES_USER: danim
          POSTGRES_PASSWORD: danim
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: danim
          DB_USER: danim
          DB_PASSWORD: danim
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          REDIS_AUTH_URL: redis://localhost:6379/2
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: |
          set +e
          uv run coverage run -m pytest
          exit_code=$?
          set -e
          if [ $exit_code -eq 5 ]; then exit 0; else exit $exit_code; fi

  build:
    needs: [nginx, lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/danim-backend:latest

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <defs>
    <!-- Arrowhead markers per color -->
    <marker id="mg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1DB954"/>
    </marker>
    <marker id="mb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
    </marker>
    <marker id="mr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff7b72"/>
    </marker>
    <marker id="ms" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#56d364"/>
    </marker>
    <marker id="mp" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a371f7"/>
    </marker>
    <marker id="mw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="330" rx="16" fill="#0d1117"/>
  <text x="340" y="26" text-anchor="middle" fill="#30363d"
    font-family="-apple-system,'Segoe UI',sans-serif"
    font-size="10" letter-spacing="4" font-weight="700">ARCHITECTURE</text>

  <!-- EC2 Container (dashed border) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.3s" fill="freeze"/>
    <rect x="158" y="46" width="362" height="190" rx="12"
      fill="#0d1f35" stroke="#1f6feb" stroke-width="1" stroke-dasharray="6,4"/>
    <text x="339" y="64" text-anchor="middle" fill="#388bfd"
      font-family="-apple-system,'Segoe UI',sans-serif"
      font-size="10" letter-spacing="2" font-weight="700">AWS EC2</text>
  </g>

  <!-- Client -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.1s" fill="freeze"/>
    <rect x="18" y="108" width="112" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="74" y="131" text-anchor="middle"
      font-family="Apple Color Emoji,Segoe UI Emoji,sans-serif" font-size="18">🖥️</text>
    <text x="74" y="152" text-anchor="middle" fill="#c9d1d9"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="700">Client</text>
  </g>

  <!-- Nginx (inside EC2) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/>
    <rect x="182" y="108" width="98" height="56" rx="10" fill="#0d2818" stroke="#1DB954" stroke-width="1.5"/>
    <text x="231" y="131" text-anchor="middle"
      font-family="Apple Color Emoji,Segoe UI Emoji,sans-serif" font-size="18">🔀</text>
    <text x="231" y="152" text-anchor="middle" fill="#1DB954"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="700">Nginx</text>
  </g>

  <!-- Django (inside EC2) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
    <rect x="316" y="82" width="168" height="100" rx="10" fill="#1a1a2e" stroke="#6e40c9" stroke-width="1.5"/>
    <text x="400" y="110" text-anchor="middle"
      font-family="Apple Color Emoji,Segoe UI Emoji,sans-serif" font-size="18">⚙️</text>
    <text x="400" y="131" text-anchor="middle" fill="#a371f7"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700">Django</text>
    <text x="400" y="148" text-anchor="middle" fill="#6e40c9"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="10">REST API + Channels</text>
    <text x="400" y="164" text-anchor="middle" fill="#6e40c9"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="10">Daphne (ASGI)</text>
  </g>

  <!-- RDS -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze"/>
    <rect x="552" y="60" width="108" height="56" rx="10" fill="#0d1f35" stroke="#388bfd" stroke-width="1.5"/>
    <text x="606" y="83" text-anchor="middle"
      font-family="Apple Color Emoji,Segoe UI Emoji,sans-serif" font-size="16">🗄️</text>
    <text x="606" y="104" text-anchor="middle" fill="#58a6ff"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="700">RDS · PostgreSQL</text>
  </g>

  <!-- Redis -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>
    <rect x="552" y="136" width="108" height="52" rx="10" fill="#2b0d0d" stroke="#f85149" stroke-width="1.5"/>
    <text x="606" y="158" text-anchor="middle"
      font-family="Apple Color Emoji,Segoe UI Emoji,sans-serif" font-size="16">⚡</text>
    <text x="606" y="178" text-anchor="middle" fill="#ff7b72"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="700">Redis</text>
  </g>

  <!-- AWS S3 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.7s" fill="freeze"/>
    <rect x="420" y="260" width="110" height="52" rx="10" fill="#0f2b0f" stroke="#3fb950" stroke-width="1.5"/>
    <text x="475" y="282" text-anchor="middle"
      font-family="Apple Color Emoji,Segoe UI Emoji,sans-serif" font-size="16">🪣</text>
    <text x="475" y="302" text-anchor="middle" fill="#56d364"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="700">AWS S3</text>
  </g>

  <!-- GitHub Actions -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.0s" fill="freeze"/>
    <rect x="158" y="260" width="130" height="52" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="223" y="282" text-anchor="middle"
      font-family="Apple Color Emoji,Segoe UI Emoji,sans-serif" font-size="16">🔄</text>
    <text x="223" y="302" text-anchor="middle" fill="#c9d1d9"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="700">GitHub Actions</text>
  </g>

  <!-- Sentry -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.0s" fill="freeze"/>
    <rect x="18" y="260" width="110" height="52" rx="10" fill="#1a0d2b" stroke="#6e40c9" stroke-width="1.5"/>
    <text x="73" y="282" text-anchor="middle"
      font-family="Apple Color Emoji,Segoe UI Emoji,sans-serif" font-size="16">📡</text>
    <text x="73" y="302" text-anchor="middle" fill="#a371f7"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="700">Sentry</text>
  </g>

  <!-- ─── Connection lines ─── -->

  <!-- Client → Nginx: (130, 136) → (180, 136) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.6s" fill="freeze"/>
    <line x1="130" y1="136" x2="179" y2="136"
      stroke="#1DB954" stroke-width="1.5" marker-end="url(#mg)"/>
    <text x="154" y="128" text-anchor="middle" fill="#484f58"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="9">HTTPS/WSS</text>
  </g>

  <!-- Nginx → Django: (280, 136) → (313, 136) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
    <line x1="280" y1="136" x2="313" y2="136"
      stroke="#1DB954" stroke-width="1.5" marker-end="url(#mg)"/>
  </g>

  <!-- Django → RDS: (484, 110) → (549, 86) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>
    <line x1="484" y1="110" x2="549" y2="88"
      stroke="#58a6ff" stroke-width="1.5" marker-end="url(#mb)"/>
  </g>

  <!-- Django → Redis: (484, 148) → (549, 162) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>
    <line x1="484" y1="148" x2="549" y2="162"
      stroke="#ff7b72" stroke-width="1.5" marker-end="url(#mr)"/>
  </g>

  <!-- Django → S3: (430, 182) → (462, 257) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.8s" fill="freeze"/>
    <line x1="430" y1="182" x2="458" y2="257"
      stroke="#56d364" stroke-width="1.5" marker-end="url(#ms)"/>
  </g>

  <!-- GitHub Actions → EC2 bottom: (223, 260) → (230, 240) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.1s" fill="freeze"/>
    <line x1="223" y1="260" x2="228" y2="241"
      stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#mw)"/>
    <text x="200" y="254" text-anchor="middle" fill="#484f58"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="9">CI/CD</text>
  </g>

  <!-- Django → Sentry (monitoring, dashed): (340, 182) → (128, 260) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.2s" fill="freeze"/>
    <line x1="340" y1="182" x2="128" y2="257"
      stroke="#a371f7" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#mp)"/>
    <text x="220" y="234" text-anchor="middle" fill="#484f58"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="9">모니터링</text>
  </g>
</svg>

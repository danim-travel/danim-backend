<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <defs>
    <marker id="mr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1DB954"/>
    </marker>
    <marker id="ml" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="300" rx="16" fill="#0d1117"/>
  <text x="340" y="26" text-anchor="middle" fill="#30363d"
    font-family="-apple-system,'Segoe UI',sans-serif"
    font-size="10" letter-spacing="4" font-weight="700">WEBSOCKET  AUTH  FLOW</text>

  <!-- Participant columns: x = 80, 250, 430, 600 -->

  <!-- Participant: Client -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze"/>
    <rect x="30" y="42" width="100" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="80" y="65" text-anchor="middle" fill="#c9d1d9"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700">Client</text>
  </g>

  <!-- Participant: REST API -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <rect x="200" y="42" width="100" height="36" rx="8" fill="#0d2818" stroke="#1DB954" stroke-width="1.5"/>
    <text x="250" y="65" text-anchor="middle" fill="#1DB954"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700">REST API</text>
  </g>

  <!-- Participant: Redis -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    <rect x="380" y="42" width="100" height="36" rx="8" fill="#2b0d0d" stroke="#f85149" stroke-width="1.5"/>
    <text x="430" y="65" text-anchor="middle" fill="#ff7b72"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700">Redis</text>
  </g>

  <!-- Participant: WebSocket -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/>
    <rect x="550" y="42" width="100" height="36" rx="8" fill="#1a1a2e" stroke="#6e40c9" stroke-width="1.5"/>
    <text x="600" y="65" text-anchor="middle" fill="#a371f7"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700">WebSocket</text>
  </g>

  <!-- Lifelines -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.5s" fill="freeze"/>
    <line x1="80"  y1="78" x2="80"  y2="290" stroke="#21262d" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="250" y1="78" x2="250" y2="290" stroke="#21262d" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="430" y1="78" x2="430" y2="290" stroke="#21262d" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="600" y1="78" x2="600" y2="290" stroke="#21262d" stroke-width="1" stroke-dasharray="4,3"/>
  </g>

  <!-- Message 1: Client → REST API: POST /api/v1/websocket-key -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
    <line x1="84" y1="112" x2="246" y2="112" stroke="#1DB954" stroke-width="1.5" marker-end="url(#mr)"/>
    <rect x="96" y="98" width="142" height="18" rx="4" fill="#0d1117"/>
    <text x="167" y="111" text-anchor="middle" fill="#7ee787"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="600">POST /api/v1/websocket-key</text>
  </g>

  <!-- Message 2: REST API → Redis: socket_key 저장 (TTL 30s) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>
    <line x1="254" y1="144" x2="426" y2="144" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#mr)"/>
    <rect x="264" y="130" width="154" height="18" rx="4" fill="#0d1117"/>
    <text x="341" y="143" text-anchor="middle" fill="#ff7b72"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="600">socket_key 저장 (TTL 30s)</text>
  </g>

  <!-- Message 3: REST API → Client: socket_key 반환 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7s" fill="freeze"/>
    <line x1="246" y1="176" x2="84"  y2="176" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ml)"/>
    <rect x="96" y="162" width="142" height="18" rx="4" fill="#0d1117"/>
    <text x="167" y="175" text-anchor="middle" fill="#79c0ff"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="600">socket_key 반환</text>
  </g>

  <!-- Message 4: Client → WebSocket: WS 연결 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.2s" fill="freeze"/>
    <line x1="84" y1="208" x2="596" y2="208" stroke="#a371f7" stroke-width="1.5" marker-end="url(#mr)"/>
    <rect x="196" y="194" width="288" height="18" rx="4" fill="#0d1117"/>
    <text x="340" y="207" text-anchor="middle" fill="#a371f7"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="600">WS 연결 (?socket_key=xxx)</text>
  </g>

  <!-- Message 5: WebSocket → Redis: key 검증 + 1회 삭제 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.7s" fill="freeze"/>
    <line x1="596" y1="236" x2="434" y2="236" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#ml)"/>
    <rect x="440" y="222" width="148" height="18" rx="4" fill="#0d1117"/>
    <text x="514" y="235" text-anchor="middle" fill="#ff7b72"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="600">key 검증 + 1회 삭제</text>
  </g>

  <!-- Message 6: WebSocket → Client: 연결 수립 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.2s" fill="freeze"/>
    <line x1="596" y1="268" x2="84"  y2="268" stroke="#1DB954" stroke-width="2" marker-end="url(#ml)"/>
    <rect x="196" y="254" width="288" height="18" rx="4" fill="#0d1117"/>
    <text x="340" y="267" text-anchor="middle" fill="#1DB954"
      font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="700">✓  연결 수립 완료</text>
  </g>
</svg>

[project]
name = "danim-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-allauth>=65.0",
    "dj-rest-auth>=7.0",
    "django-storages[s3]>=1.14",
    "boto3>=1.34",
    "django-cors-headers>=4.3",
    "django-redis>=5.4",
    "Pillow>=10.3",
    "django-environ>=0.11",
    "drf-spectacular>=0.27",
    "psycopg2-binary>=2.9",
    "gunicorn>=22.0",
    "daphne>=4.0",
    "channels>=4.0",
    "channels-redis>=4.0",
    "python-ulid>=3.1.0",
    "httpx>=0.28.1",
    "pgvector>=0.4.2",
    "sentry-sdk[django]>=2.62.0",
    "celery>=5.6.3",
    "whitenoise>=6.6",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "mypy==1.13.0",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
    "coverage>=7.5",
    "pytest>=8.0",
    "pytest-django>=4.8",
    # compose 파일을 파싱하는 테스트가 쓴다. drf-spectacular 경유 전이 의존이라
    # 상위 패키지가 끊으면 테스트가 수집 단계에서 깨진다 — 명시한다.
    "pyyaml>=6.0",
    "pre-commit>=3.7",
    "boto3-stubs[s3]>=1.43.16",
    "sentence-transformers",
    "torch",
]

[tool.black]
line-length = 90
target-version = ["py313"]
skip-magic-trailing-comma = false

[tool.isort]
profile = "black"
line_length = 90

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]


[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

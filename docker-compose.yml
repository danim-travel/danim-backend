services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: danim
      POSTGRES_USER: danim
      POSTGRES_PASSWORD: danim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danim"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  django:
    build: .
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - venv:/app/.venv
    ports:
      - "8000:8000"
    env_file:
      - envs/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    command: uv run celery -A config worker -l info
    volumes:
      - .:/app
      - venv:/app/.venv
    env_file:
      - envs/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: uv run celery -A config beat -l info
    volumes:
      - .:/app
      - venv:/app/.venv
    env_file:
      - envs/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  venv:

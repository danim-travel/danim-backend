services:
  db:
    image: pgvector/pgvector:pg16
    env_file:
      - envs/.env.dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  django:
    image: kochanyeol/danim-backend:dev
    env_file:
      - envs/.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - db
      - redis
    restart: always

  # 알림(post_save 시그널)을 소비하는 Celery 워커. --pool=solo 로 단일 프로세스만
  # 띄워 메모리를 최소화한다(prefork 는 CPU 수만큼 자식을 띄워 소형 dev 서버를 OOM).
  # mem_limit 로 상한을 두어, 워커가 폭주해도 daphne 를 밀어내 502 를 유발하지 않게 한다.
  celery-worker:
    image: kochanyeol/danim-backend:dev
    command: uv run celery -A config worker -l info --pool=solo
    env_file:
      - envs/.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - db
      - redis
    restart: always
    mem_limit: 400m
    mem_reservation: 250m

  # CELERY_BEAT_SCHEDULE(매일 03:00 오래된 알림 정리)를 도는 스케줄러. beat 는 가볍다.
  celery-beat:
    image: kochanyeol/danim-backend:dev
    command: uv run celery -A config beat -l info
    env_file:
      - envs/.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - db
      - redis
    restart: always
    mem_limit: 250m

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/ubuntu/danim-backend/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - django
    restart: always

volumes:
  postgres_data:

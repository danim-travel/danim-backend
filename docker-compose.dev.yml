services:
  db:
    image: pgvector/pgvector:pg16
    env_file:
      - envs/.env.dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # prod와 같은 이유로 named volume + appendonly + noeviction을 둔다
  # (근거는 docker-compose.prod.yml의 같은 위치 주석).
  # dev가 더 중요하다 — main에 apps/supports가 없어 첨부 파기가 **실제로 도는 유일한
  # 환경**이 dev이고, prod 첫 배포는 이 설계의 첫 실행이 된다.
  # maxmemory·mem_limit을 두지 않는 이유도 prod와 같다 — auth 캐시가 이 인스턴스에서
  # fail-closed다(6차 리뷰). 실측 후 도입은 이슈 #343.
  redis:
    image: redis:7-alpine
    command: >
      redis-server --appendonly yes
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    restart: always

  django:
    image: kochanyeol/danim-backend:dev
    env_file:
      - envs/.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - db
      - redis
    restart: always

  # 알림(post_save 시그널)을 소비하는 Celery 워커. --pool=solo 로 단일 프로세스만
  # 띄워 메모리를 최소화한다(prefork 는 CPU 수만큼 자식을 띄워 소형 dev 서버를 OOM).
  # mem_limit 로 상한을 두어, 워커가 폭주해도 daphne 를 밀어내 502 를 유발하지 않게 한다.
  #
  # 주의: solo 는 태스크를 순차 처리하고 task_time_limit 을 지원하지 않는다. 오래 걸리거나
  # 메모리를 많이 쓰는 태스크를 이 워커에 추가하면 그동안 알림 전송이 전부 대기한다.
  # 그런 작업은 별도 큐(-Q)와 워커로 분리할 것.
  #
  # [정정] 이 주석은 원래 "OOM-kill 되면 visibility_timeout(기본 1시간) 뒤에 재배달된다"고
  # 적고 있었으나 사실이 아니다 — celery 기본값 acks_late=False는 **실행 시작 시점에**
  # ack하므로 그 메시지는 unacked 집합에 없어 재배달되지 않고 그대로 증발한다.
  # "늦게라도 복구된다"는 잘못된 안심을 주는 문장이었다(3차 리뷰).
  # 재배달이 필요한 태스크는 그 태스크에 acks_late=True를 명시해야 한다
  # (예: apps/supports/tasks.delete_inquiry_attachment_task — 멱등하므로 안전).
  # -Q celery: 이 워커는 기본 큐만 소비한다. 첨부 파기(s3_cleanup)는 위 주석이
  # 금지한 "오래 걸리는 외부 I/O"라 아래 전용 워커로 분리했다.
  celery-worker:
    image: kochanyeol/danim-backend:dev
    command: uv run --no-sync celery -A config worker -l info --pool=solo -Q celery
    env_file:
      - envs/.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - db
      - redis
    restart: always
    mem_limit: 400m
    mem_reservation: 250m

  # 첨부 파기 전용. S3 왕복이 늘어져도 알림이 밀리지 않게 큐를 분리한다.
  celery-s3-worker:
    image: kochanyeol/danim-backend:dev
    command: uv run --no-sync celery -A config worker -l info --pool=solo -Q s3_cleanup
    env_file:
      - envs/.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - db
      - redis
    restart: always
    stop_grace_period: 40s
    mem_limit: 400m
    mem_reservation: 250m

  # CELERY_BEAT_SCHEDULE(매일 03:00 오래된 알림 정리)를 도는 스케줄러. beat 는 가볍다.
  celery-beat:
    image: kochanyeol/danim-backend:dev
    command: uv run --no-sync celery -A config beat -l info
    env_file:
      - envs/.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - db
      - redis
    restart: always
    mem_limit: 250m

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/ubuntu/danim-backend/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - django
    restart: always

volumes:
  redis-data:
  postgres_data:
